monitor = ,preferred,auto,1

$terminal = alacritty
$filemanager = dolphin
$browser = brave
$documentviewer = okular
$ebookreader = foliate

bind = $mainMod, T, exec, $terminal
bind = SUPER+Shift, T, exec, foot
bind = $mainMod, F, exec, $filemanager
bind = $mainMod, B, exec, DISPLAY=:0 $browser --ozone-platform=x11
bind = $mainMod, O, exec, $documentviewer
bind = $mainMod, G, exec, DISPLAY=:0 GDK_BACKEND=x11 $ebookreader
bind = ALT, Tab, workspace, e+1
bind = Alt+Shift, Tab, workspace, e-1
bind = $mainMod, I, workspaceopt, allfloat
bind = SUPER+Shift, Tab, exec, hyprctl dispatch cyclenext
bind = ALT, F4, exec, hyprctl dispatch killactive
bind = , F12, exec, hyprctl dispatch fullscreen
bind = $mainMod, N, exec, hyprctl dispatch workspace empty
bind = $mainMod, R, exec, hyprctl reload
# bind = $mainMod, Y, togglesplit
#bind = $mainMod, A, exec, anyrun
#bind=,Print,exec,~/.config/hypr/scripts/screenshot2
#bind=SUPER,Print,exec,~/.config/hypr/scripts/screenshot
#bind = , Print, exec, hyprshot -m output -m eDP-1 --freeze -o ~/Pictures
#bind = Ctrl, Print, exec, hyprshot -m window --freeze -o ~/Pictures

# PrtSc: Capture whole screen
bind = , Print, exec, hyprshot -m output -m eDP-1 -o ~/Pictures
# Super + Shift + PrtSc: HD capture of whole screen
bind = SUPER SHIFT, Print, exec, bash -c 'grim -l 0 -t png - | tee ~/Pictures/$(date +%Y%m%d_%Hh%Mm%Ss)_grim_full.png | wl-copy'
# Super + PrtSc: Capture specific window
bind = SUPER, Print, exec, hyprshot -m window -o ~/Pictures
# Ctrl + Shift + PrtSc: HD capture of selected region
bind = CTRL SHIFT, Print, exec, bash -c 'sel=$(slurp -b 00000000 -c 00000000 -s 00000000) && grim -l 0 -t png -g "$sel" - | tee ~/Pictures/$(date +%Y%m%d_%Hh%Mm%Ss)_grim_cut.png | wl-copy'

bind=,XF86MonBrightnessUp,exec,brightnessctl set 960+
bind=,XF86MonBrightnessDown,exec,brightnessctl set 960-
bind=,XF86AudioRaiseVolume,exec,amixer set Master 5%+
bind=,XF86AudioLowerVolume,exec,amixer set Master 5%-
bind=,XF86AudioMute,exec,amixer set Master toggle

bind= ,XF86AudioPlay, exec, playerctl play-pause
bind= ,XF86AudioNext, exec, playerctl next
bind= ,XF86AudioPrev, exec, playerctl previous

bind = ALT, X, exec, playerctl play-pause
bind = ALT, Z, exec, playerctl previous
bind = ALT, C, exec, playerctl next
bind = $mainMod, L, exec, swaylock
bind = $mainMod, A, exec, rofi -show drun
bind = $mainMod, E, exec, emote
#bindsym = XF86AudioPlay exec playerctl play
#bindsym = XF86AudioPause exec playerctl pause
#bindsym = XF86AudioNext exec playerctl next
#bindsym = XF86AudioPrev exec playerctl previous

# rofi animation
animation = layers, 1, 7, default, slide
bind = $mainMod, F8, exec, wlsunset -T 5000
bind = $mainMod, F7, exec, pkill wlsunset
bind = $mainMod, F12, exec, wlogout

# Move Windows with mainMod + arrow keys
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindm = SUPER, Control_L, movewindow
bindm = SUPER, ALT_L, resizewindow

# Resize Floating window
bind = SUPER ALT, right, resizeactive, 50 0
bind = SUPER ALT, left, resizeactive, -50 0
bind = SUPER ALT, up, resizeactive, 0 -50
bind = SUPER ALT, down, resizeactive, 0 50

