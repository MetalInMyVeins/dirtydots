# foot.ini
# Ported from alacritty.toml
# Verified against foot.ini(5) (foot 1.27.0) — corrected after the first
# pass produced several invalid keys/sections.
#
# NOTES ON THINGS THAT DON'T MAP 1:1 (read before using):
# - foot has no window.opacity section; opacity lives under [colors-dark]
#   as "alpha" (0.0-1.0), applied to the background only.
# - [colors] is deprecated — [colors-dark] is required now (paired with
#   an optional [colors-light] if you ever want a light theme to toggle to).
# - foot's bell has no animation/duration/color. [bell] only supports:
#   system (ring the system bell), urgent (XDG urgency hint), notify
#   (desktop notification), visual (flash the window margins), and an
#   optional command to run. I used visual=yes as the closest match to
#   your EaseOutExpo color-flash bell — the flash *color* itself is set
#   separately, under [colors-dark].flash, not in [bell] at all.
# - foot has no built-in box-drawing toggle to port — it draws box/line
#   glyphs itself by default (box-drawings-uses-font-glyphs=no).
# - Alacritty's unfocused_hollow maps to foot's [cursor] unfocused-style,
#   which takes unchanged/hollow/none — not a plain yes/no key.
# - OSC 52 clipboard access is its own [security] section in foot, with
#   values disabled/copy-enabled/paste-enabled/enabled — not a [main] or
#   [colors] key. Alacritty's "OnlyCopy" maps to copy-enabled.
# - Scrollback paging/home/end binds belong in [key-bindings] on foot —
#   there is no separate [scrollback-bindings] section.
# - "line_indicator" and "footer_bar" (Alacritty) have no foot equivalent.
# - foot config keys are lowercase-with-dash, not camel/PascalCase.

[main]
term=xterm-256color
# foot's font syntax is "Family:option=value", no separate style field.
font=JetBrains Mono ExtraBold:size=10
font-bold=JetBrains Mono ExtraBold:size=10
font-italic=JetBrains Mono ExtraBold:italic:size=10
font-bold-italic=JetBrains Mono ExtraBold:italic:size=10

# Alacritty's window.padding { x = 7, y = 2 }
pad=7x2

[security]
# Alacritty's terminal.osc52 = "OnlyCopy" -> applications can write to
# the clipboard via OSC 52 but not read from it.
osc52=copy-enabled

[scrollback]
lines=30000

[cursor]
style=block
blink=no
# Closest match to Alacritty's unfocused_hollow = true.
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[colors-dark]
# alpha applies to the background color's alpha channel (Alacritty's
# window.opacity = 0.75)
alpha=0.85
blur=no

background=1b0d00
foreground=9a9996

# regular (Alacritty colors.normal)
regular0=180a09
regular1=af0000
regular2=be6835
regular3=d6924b
regular4=007373
regular5=7a365f
regular6=6ba0a5
regular7=c5c1c0

# bright (Alacritty colors.bright)
bright0=535554
bright1=ff0000
bright2=be6835
bright3=d6924b
bright4=006666
bright5=8a3f6b
bright6=6ba0a5
bright7=ffffff

# dim (Alacritty colors.dim)
dim0=120806
dim1=7a4527
dim2=8c5634
dim3=b77a3d
dim4=3e6170
dim5=6b462e
dim6=547d82
dim7=9a9796

# cursor colors (Alacritty colors.cursor: text/cursor)
cursor=180a09 6ba0a5

# search match colors (Alacritty colors.search.matches: fg/bg)
search-box-no-match=180a09 af0000
search-box-match=180a09 6a9ba0

# selection (Alacritty colors.selection text=CellBackground
# bg=CellForeground — foot has no "use cell colors" keyword, so this
# uses explicit colors approximating the same swap-on-select look)
selection-foreground=1b0d00
selection-background=c5c1c0

# Alacritty's bell.color = "#22d4b5" (cyan) — this is the closest
# equivalent target for a bell-related color in foot.
flash=22d4b5

[bell]
# visual=yes flashes the window on BEL, closest to Alacritty's animated
# color-flash bell. There's no duration/animation-curve option to port.
visual=yes
urgent=yes
notify=no

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
# Shift+Insert = paste primary selection (Alacritty PasteSelection)
primary-paste=Shift+Insert
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-home=Shift+Home
scrollback-end=Shift+End

[mouse-bindings]
# Alacritty's mouse.bindings: Middle -> Paste (primary selection paste).
# This is also foot's own default, listed explicitly to match your file.
primary-paste=BTN_MIDDLE
