[env]
TERM = "alacritty"

[window]
opacity = 0.85
padding = { x = 7, y = 2 }
# dynamic_padding = false
# decorations = "full"
# startup_mode = "Windowed"
# dynamic_title = true

[scrolling]
history = 30000
# multiplier = 3

[font]
normal = { family = "JetBrains Mono ExtraBold", style = "ExtraBold" }
bold = { family = "JetBrains Mono ExtraBold", style = "ExtraBold" }
italic = { family = "JetBrains Mono ExtraBold", style = "ExtraBold Italic" }
bold_italic = { family = "JetBrains Mono ExtraBold", style = "ExtraBold Italic" }
size = 10.0

# offset = { x = 0, y = 0 }
# glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

[bell]
animation = "EaseOutExpo"
duration = 150
color = "#22d4b5"  # Your cyan, or "#d42638" for red
# color = "#ffffff"
#command = { program = "notify-send", args = ["Bell"] }
#command = { program = "paplay", args = ["/usr/share/sounds/freedesktop/stereo/bell.oga"] }
#command = { program = "speaker-test", args = ["-t", "sine", "-f", "100", "-l", "1"] }
# command = { program = "timeout", args = ["0.1s", "speaker-test", "-t", "sine", "-f", "100", "-l", "1"] }
#command = { program = "beep", args = ["-f", "800", "-l", "100"] }
#command = { program = "ffplay", args = ["-nodisp", "-autoexit", "-t", "0.1", "-f", "lavfi", "sine=frequency=1000"] }

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Off" }
# vi_mode_style = "None"
# blink_interval = 750
# blink_timeout = 5
unfocused_hollow = true
# thickness = 0.15

[terminal]
# osc52 = "OnlyCopy"

