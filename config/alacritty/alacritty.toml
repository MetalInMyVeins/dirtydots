# NEW SETUP
[colors.primary]
background = "#150a00"
foreground = "#6e8b5a"
# foreground = "#9a9996"

[colors.cursor]
text = "#180A09"
cursor = "#6ba0a5"

[colors.vi_mode_cursor]
text = "#180A09"
cursor = "#D6924B"

[colors.search.matches]
foreground = "#180A09"
background = "#6A9BA0"

[colors.search.focused_match]
foreground = "CellBackground"
background = "CellForeground"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#180A09"
background = "#C5C1C0"

[colors.selection]
text = "CellBackground"
background = "CellForeground"

[colors.normal]
black   = "#180A09"
red     = "#800000"
green   = "#B3683E"
yellow  = "#D6924B"
blue    = "#006666"
magenta = "#7a365f"
cyan    = "#6ba0a5"
white   = "#C5C1C0"

[colors.bright]
black   = "#535554"
red     = "#ff0000"
green   = "#B3683E"
yellow  = "#D6924B"
blue    = "#006666"
magenta = "#8a3f6b"
cyan    = "#6ba0a5"
white   = "#FFFFFF"

[colors.dim]
black   = "#120806"
red     = "#7A4527"
green   = "#8C5634"
yellow  = "#B77A3D"
blue    = "#3E6170"
magenta = "#6B462E"
cyan    = "#547D82"
white   = "#9A9796"



[mouse]
hide_when_typing = false

[[mouse.bindings]]
mouse = "Middle"
action = "Paste"

# Key bindings (similar to your foot config)
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "PasteSelection"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

# Scrollback bindings
[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
action = "ScrollToBottom"
